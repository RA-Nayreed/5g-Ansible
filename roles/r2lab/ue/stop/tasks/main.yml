---
- name: START_UE_STOP
  ansible.builtin.meta: noop

- name: Normalize UE name (accept ue or ue_item)
  set_fact:
    ue: "{{ ue | default(ue_item) }}"

- name: Resolve UE connection mode
  set_fact:
    ue_mode: "{{ hostvars[ue].mode | default('mbim') }}"

- name: Detect whether this UE is a phone
  set_fact:
    is_phone: "{{ ue in (groups['phones'] | default([])) }}"

- name: Resolve direct R2Lab SSH host-key policy
  ansible.builtin.set_fact:
    r2lab_direct_ssh_options: >-
      {{ '-o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=yes'
         if (r2lab_strict_host_key_checking | default(false) | bool)
         else '-o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no' }}

- name: Phone - resolve adb / ssh parameters for {{ ue }}
  set_fact:
    phone_ssh: "{{ hostvars[ue].ansible_user | default('tester') }}@{{ hostvars[ue].ansible_host | default('mac' ~ ue) }}"
    adb_bin: "{{ hostvars[ue].adb_bin | default('adb') }}"
    adb_opts: "{{ ('-s ' ~ hostvars[ue].serial) if (hostvars[ue].serial is defined and (hostvars[ue].serial | string | length) > 0) else '' }}"
  when: is_phone

- name: Phone - airplane mode ON for selected UE {{ ue }}
  shell: >
    ssh {{ r2lab_direct_ssh_options }} -i /home/faraday/r2lab-embedded/mac-ssh-keys/macphone
    {{ phone_ssh }}
    '{{ adb_bin }} {{ adb_opts }} shell cmd connectivity airplane-mode enable'
  delegate_to: faraday.inria.fr
  when: is_phone
  ignore_errors: true

- name: Phone - verify airplane mode is ON for {{ ue }}
  shell: >
    ssh {{ r2lab_direct_ssh_options }} -i /home/faraday/r2lab-embedded/mac-ssh-keys/macphone
    {{ phone_ssh }}
    '{{ adb_bin }} {{ adb_opts }} shell settings get global airplane_mode_on'
  register: phone_apm
  delegate_to: faraday.inria.fr
  when: is_phone
  changed_when: false
  ignore_errors: true

- name: MBIM - stop selected UE {{ ue }} via jump host
  shell: ssh {{ r2lab_direct_ssh_options }} root@{{ ue }} 'stop.sh'
  delegate_to: faraday.inria.fr
  when:
    - not is_phone
    - ue_mode == 'mbim'
  ignore_errors: true

- name: QMI - detach selected UE {{ ue }} via jump host
  shell: ssh {{ r2lab_direct_ssh_options }} root@{{ ue }} 'python3 /usr/local/bin/ci_ctl_qtel.py /dev/ttyUSB2 detach'
  delegate_to: faraday.inria.fr
  when:
    - not is_phone
    - ue_mode == 'qmi'
  ignore_errors: true
